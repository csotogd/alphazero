[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "pentomino-alphazero"
version = "0.1.0"
description = "Game-independent policy/value self-play research engine"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "torch>=2.8,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
az-train = "az.train:main"
az-studio = "az.server:main"
[tool.setuptools.packages.find]
include = ["az*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
